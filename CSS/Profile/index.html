<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Profile Card</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="profile-card">
        <div class="cover-photo"></div>
        <div class="profile-info">
            <div class="profile-pic"></div>
            <h2 class="username">@username</h2>
            <p class="bio">Bio: Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt.</p>
            <div class="links">
                <span><i class="fas fa-link"></i> 3 links</span>
            </div>
        </div>
        
        <div class="stats">
            <div class="stat">
                <span class="number">58</span>
                <span class="label">Posts</span>
            </div>
            <div class="stat">
                <span class="number">1.2K</span>
                <span class="label">Followers</span>
            </div>
            <div class="stat">
                <span class="number">45</span>
                <span class="label">Following</span>
            </div>
        </div>
        
        <div class="actions">
            <button class="message-btn">Message</button>
            <button class="follow-btn">Follow</button>
        </div>
    </div>
</body>
</html>
