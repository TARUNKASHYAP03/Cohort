<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <article class="card">
      <img
        src="https://images.unsplash.com/photo-1560769629-975ec94e6a86?q=80&w=1528&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
        alt="Nike Air Max shoes"
        class="card-image"
      />
      <h1>Nike Air Max</h1>
      <div class="rating" aria-label="Rated 4.2 out of 5 stars">
        ★★★★☆ <span>(4.2)</span>
      </div>
      <h3>&#x20b9;7,999</h3>
      <p>
        Premium running shoes with Air cushioning technology for maximum
        comfort.
      </p>
      <button>ADD To Cart</button>
    </article>
  </body>
</html>
