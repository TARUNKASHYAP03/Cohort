<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 5</title>
    <style>
      .image-box {
        width: 400px;
        height: 300px;
        background-image: url("https://images.unsplash.com/photo-1660233867951-a05f7f6e4b14?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D");
        background-size: cover;
        background-position: center;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <!-- 1. Image with alt, title and fixed width -->
    <img
      src="https://images.unsplash.com/photo-1569865867048-34cfce8d58fe?q=80&w=1578&auto=format&fit=crop"
      width="400"
      alt="London Bridge under grey sky"
      title="Image of London Bridge"
    />

    <!-- 2. Clickable image that links to external website -->
    <p>
      <a
        href="https://unsplash.com/photos/people-on-bridge-near-queen-elizabeth-tower-under-gray-skies-W1Y4Y_DBGKw"
        target="_blank"
        rel="noopener"
      >
        <img
          src="https://images.unsplash.com/photo-1569865867048-34cfce8d58fe?q=80&w=1578&auto=format&fit=crop"
          width="400"
          alt="Click to open Unsplash photo"
          title="Click to visit original photo"
        />
      </a>
    </p>

    <!-- 3. Div with background image -->
    <div class="image-box"></div>
  </body>
</html>
