<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Media Page</title>
</head>
<body>

  <!-- 1. Embedded Video -->
  <h2>Embedded Video</h2>
  <video width="500" controls autoplay muted poster="https://via.placeholder.com/500x300">
    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4" />
    <source src="https://www.w3schools.com/html/mov_bbb.ogg" type="video/ogg" />
    <track src="https://www.w3schools.com/html/track.vtt" kind="subtitles" srclang="en" label="English">
    Your browser does not support the video tag.
  </video>

  <!-- 2. Audio Player -->
  <h2>Audio Player</h2>
  <audio controls>
    <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
    <source src="https://www.w3schools.com/html/horse.ogg" type="audio/ogg">
    Your browser does not support the audio element.
  </audio>

  <!-- 3. YouTube Video -->
  <h2>YouTube Video</h2>
  <iframe 
    width="560" 
    height="315" 
    src="https://www.youtube.com/embed/tgbNymZ7vqY" 
    title="YouTube video player" 
    frameborder="0" 
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
    allowfullscreen>
  </iframe>

  <!-- 4. Table of Formats -->
  <h2>Common Video and Audio Formats</h2>
  <table border="1" cellpadding="8">
    <thead>
      <tr>
        <th>Format</th>
        <th>Type</th>
        <th>Description</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>MP4</td>
        <td>Video</td>
        <td>Most widely supported video format for web and mobile.</td>
      </tr>
      <tr>
        <td>MP3</td>
        <td>Audio</td>
        <td>Common format for music and audio streaming.</td>
      </tr>
      <tr>
        <td>WebM</td>
        <td>Video</td>
        <td>Open-source video format optimized for web use.</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
