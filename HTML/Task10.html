<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 10 - Attributes</title>
  <link rel="stylesheet" href="styles.css" rel="noopener">
</head>
<body>

  <!-- Paragraph with id and class -->
  <p id="intro" class="highlight">This is a paragraph with both <strong>id</strong> and <strong>class</strong> attributes.</p>

  <!-- Anchor tag with title and target -->
  <a href="https://www.example.com" target="_blank" rel="noopener" title="Visit Example Website">Go to Example</a>
  <br><br>

  <!-- Input with required and placeholder -->
  <input type="text" placeholder="Enter your name" required>
  <br><br>

  <!-- Styled paragraph using class -->
  <p class="styled-inline">This paragraph is styled using external CSS instead of inline CSS.</p>

  <!-- Custom data attribute -->
  <div data-user-id="12345" data-role="admin">
    This div has custom data attributes.
  </div>

</body>
</html>
