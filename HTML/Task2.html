<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Second Page</title>
  </head>
  <body>
    <h1>This is Main Heading</h1>
    <hr />

    <h2>This is First Subheading</h2>
    <p>
      This is a <strong>HTML</strong> page with an
      <i>important</i> message.<br />This line is after a line break.
    </p>
    <hr />

    <h3>This is Second Subheading</h3>
    <p>
      This is another section with <b>bold text</b>, some <i>italic text</i>,
      and an <u>underlined term</u>.
    </p>

    <small
      >Disclaimer: This message is shown using the &lt;small&gt; tag.</small
    >
  </body>
</html>
